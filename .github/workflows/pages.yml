# Build the web map from committed data and publish it to GitHub Pages.
# The Python data pipeline does not run here: data/processed/ is committed.
name: Deploy web map

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web unit tests
        run: make test-web
      - name: Build site
        run: make web
      # GitHub Pages caches files for 10 minutes; versioned URLs keep index.html, app.js,
      # lib.js and style.css from the same deploy together.
      - name: Version asset URLs
        run: |
          v="${GITHUB_SHA::7}"
          sed -i "s#src=\"app.js\"#src=\"app.js?v=$v\"#; s#href=\"style.css\"#href=\"style.css?v=$v\"#" web/index.html
          sed -i "s#from \"./lib.js\"#from \"./lib.js?v=$v\"#" web/app.js
          grep -q "app.js?v=$v" web/index.html
          grep -q "style.css?v=$v" web/index.html
          grep -q "lib.js?v=$v" web/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
