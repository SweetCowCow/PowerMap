[project]
name = "powermap"
version = "0.1.0"
description = "Taiwan power infrastructure data pipeline (OSM → GeoJSON)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "osmium>=4.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pandas>=2.2",
    "pyogrio>=0.10",
    "pyproj>=3.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["powermap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
